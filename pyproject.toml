[project]
name = "flybiped"
version = "0.1.0"
description = "A MuJoCo fruit fly (flybody) learns to stand up and walk on its hind legs with PPO on MuJoCo Warp; browser viewer included."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "mujoco==3.13.0",
  "mujoco-mjx==3.13.0",
  "mujoco-warp==3.13.0",
  "warp-lang==1.17.0",
  "jax[cuda12]==0.11.1",
  "brax==0.14.2",
  "playground==0.2.0",
  "dm-control==1.0.46",
  "ml-collections==1.1.0",
  "orbax-checkpoint==0.12.4",
  "numpy==2.5.3",
  "imageio==2.37.4",
  "imageio-ffmpeg==0.6.0",
  "trimesh==5.1.0",
  "fast-simplification==0.2.0",
  "pillow>=10",
  "h5py==3.16.0",
]

[project.optional-dependencies]
test = ["playwright==1.62.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flybiped*"]
